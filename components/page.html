<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if url %}{{ title }} | {% endif %}Sure Gamble</title>
  {% if summary %}<meta name="description" content="{{ summary }}">{% endif %}
  <meta property="og:site_name" content="Sure Gamble">
  <meta property="og:title" content="{% if url %}{{ title }}{% else %}Sure Gamble{% endif %}">
  {% if summary %}<meta property="og:description" content="{{ summary }}">{% endif %}
  <meta property="og:url" content="{{ site }}{{ url }}">
  <meta property="og:type" content="{% if dir = "articles" %}article{% else %}website{% endif %}">
  {% if cover %}<meta property="og:image" content="{{ cover.image }}">
  <meta name="twitter:card" content="{{ cover.twitter }}">{% endif %}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,600;1,400&family=Bebas+Neue&family=League+Gothic&display=swap">
  <link rel="stylesheet" href="{{ root }}assets/site.css">
  <link rel="alternate" type="application/atom+xml" href="{{ root }}feed.xml">
</head>
<body>
  {% include "header.html" %}
  <main>{{ main|safe }}</main>
  {% include "footer.html" %}
</body>
</html>
