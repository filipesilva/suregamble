<ul class="series">
  {% for s in all-series %}
  <li>
    <a href="{{ root }}{{ s.url }}">{{ s.title }}</a>
    <small>{{ s.articles|count }} part{{ s.articles|pluralize }}</small>
    {% if s.summary %}<p>{{ s.summary }}</p>{% endif %}
    <ol reversed>
      {% for a in s.latest %}
      <li><a href="{{ root }}{{ a.url }}">{{ a.title }}</a> <small>{{ a.published-at|date:"d MMM yyyy" }}</small></li>
      {% endfor %}
    </ol>
  </li>
  {% endfor %}
</ul>
<style>
  .series {
    list-style: none;
    padding: 0;

    & li {
      margin-block-end: .75rem;
    }
    & small, & p {
      color: var(--muted);
    }
    & p {
      margin: .25rem 0 0;
    }
    & ol {
      margin: .25rem 0 0;
      padding-inline-start: 1.5rem;
    }
  }
</style>
