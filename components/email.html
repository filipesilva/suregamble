<!doctype html>
<html>
<body style="margin: 0 auto; max-width: 40rem; padding: 1rem; font-family: Georgia, serif; line-height: 1.5;">
  <h1 style="margin-bottom: .25rem;"><a href="{{ site }}{{ url }}" style="color: inherit;">{{ title }}</a></h1>
  <p style="margin-top: 0; color: #666;">by {{ author.title }}{% if series %} in the {{ series.title }} series{% endif %}</p>
  {{ content|safe }}
  <hr>
  <p style="color: #666; font-size: .875rem;">
    <a href="{{ site }}{{ url }}">Read on suregamble.net</a> · {% verbatim %}<a href="{{unsubscribe_link}}">{{unsubscribe_text}}</a>{% endverbatim %}
  </p>
</body>
</html>
